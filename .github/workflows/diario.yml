name: Resumen diario (comentarios y métricas de cada cliente)

# Cada día a las 21:45 (Madrid): un aviso por cliente con sus comentarios nuevos y, los lunes, su informe semanal.
# Latido: si algo debía haber salido hace más de 30 min y no está en published.json → aviso (issue → email).
# (Más adelante: enviarlo también al email del cliente, marca.json → email_avisos.)
on:
  schedule:
    - cron: "45 19,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # >>> secretos (generado por motor/todos.py secretos; no editar a mano)
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      IG_ACCESS_TOKEN_CLINICA_FISIO_MAR: ${{ secrets.IG_ACCESS_TOKEN_CLINICA_FISIO_MAR }}
      IG_USER_ID_CLINICA_FISIO_MAR: ${{ secrets.IG_USER_ID_CLINICA_FISIO_MAR }}
      IG_ACCESS_TOKEN_DEMO: ${{ secrets.IG_ACCESS_TOKEN_DEMO }}
      IG_USER_ID_DEMO: ${{ secrets.IG_USER_ID_DEMO }}
      IG_ACCESS_TOKEN_PANADERIA_LA_ESPIGA: ${{ secrets.IG_ACCESS_TOKEN_PANADERIA_LA_ESPIGA }}
      IG_USER_ID_PANADERIA_LA_ESPIGA: ${{ secrets.IG_USER_ID_PANADERIA_LA_ESPIGA }}
      IG_ACCESS_TOKEN_PRUEBA_FLORISTERIA: ${{ secrets.IG_ACCESS_TOKEN_PRUEBA_FLORISTERIA }}
      IG_USER_ID_PRUEBA_FLORISTERIA: ${{ secrets.IG_USER_ID_PRUEBA_FLORISTERIA }}
      IG_ACCESS_TOKEN_TALLER_HERMANOS_RUIZ: ${{ secrets.IG_ACCESS_TOKEN_TALLER_HERMANOS_RUIZ }}
      IG_USER_ID_TALLER_HERMANOS_RUIZ: ${{ secrets.IG_USER_ID_TALLER_HERMANOS_RUIZ }}
      # <<< secretos
    steps:
      - name: ¿Son las 21 h en Madrid?
        id: hora
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Madrid date +%H)" = "21" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.hora.outputs.ok == '1'
        with:
          ref: main
      - uses: actions/setup-python@v6
        if: steps.hora.outputs.ok == '1'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.hora.outputs.ok == '1'
        run: pip install -r requirements.txt
      - name: Comentarios y métricas
        if: steps.hora.outputs.ok == '1'
        run: |
          if [ "$(TZ=Europe/Madrid date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python motor/todos.py diario --dir "$RUNNER_TEMP/diario" --informe
          else
            python motor/todos.py diario --dir "$RUNNER_TEMP/diario"
          fi
      - name: Avisos
        if: steps.hora.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/diario/*_comentarios.md; do
            c=$(basename "$f" _comentarios.md)
            [ -s "$f" ] && gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "💬 $c · comentarios nuevos · $(TZ=Europe/Madrid date '+%d/%m')" --body-file "$f"
          done
          for f in "$RUNNER_TEMP"/diario/*_informe.md; do
            c=$(basename "$f" _informe.md)
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "📊 $c · informe semanal · $(TZ=Europe/Madrid date '+%d/%m')" --body-file "$f"
          done
      - name: Latido (¿falta algo por publicar?)
        if: always() && steps.hora.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 motor/todos.py latido --out "$RUNNER_TEMP/latido.md"
          if [ -s "$RUNNER_TEMP/latido.md" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "🫀 Latido: publicaciones que no han salido · $(TZ=Europe/Madrid date '+%d/%m')" \
              --body-file "$RUNNER_TEMP/latido.md"
          fi
      - name: Avisar si ha fallado
        if: failure() && steps.hora.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "⚠️ Falló el resumen diario ($(TZ=Europe/Madrid date '+%d/%m'))" \
            --body "Detalle: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Guardar
        if: always() && steps.hora.outputs.ok == '1'
        run: |
          git config user.name "contenido-bot"
          git config user.email "contenido-bot@users.noreply.github.com"
          for f in clientes/*/content/comentarios_vistos.json clientes/*/content/metricas.json clientes/*/content/aprendizajes.md; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || (git commit -m "Comentarios y métricas [skip ci]" && git pull --rebase -q && git push)
