name: Prueba automática (simulación)

# Se lanza solo cada vez que subes cambios del motor, del alta o de los clientes:
#  1) prueba completa del motor con un cliente ficticio (pruebas/prueba_motor.py);
#  2) simulación de publicación de todos los clientes activos y de ensayo (no publica nada en Instagram).
# Si algo falla, GitHub te avisa por email (ejecución en rojo).
on:
  push:
    branches: [main]
    paths:
      - "motor/**"
      - "alta/**"
      - "clientes/**"
      - "pruebas/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prueba
  cancel-in-progress: true

jobs:
  prueba:
    # no se lanza con los commits automáticos del bot (publicados, métricas…)
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prueba completa del motor (cliente ficticio)
        run: python pruebas/prueba_motor.py
      - name: Simulación de publicación (todos los clientes de ensayo y activos)
        env:
          # >>> secretos (generado por motor/todos.py secretos; no editar a mano)
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          IG_ACCESS_TOKEN_CLINICA_FISIO_MAR: ${{ secrets.IG_ACCESS_TOKEN_CLINICA_FISIO_MAR }}
          IG_USER_ID_CLINICA_FISIO_MAR: ${{ secrets.IG_USER_ID_CLINICA_FISIO_MAR }}
          IG_ACCESS_TOKEN_DEMO: ${{ secrets.IG_ACCESS_TOKEN_DEMO }}
          IG_USER_ID_DEMO: ${{ secrets.IG_USER_ID_DEMO }}
          IG_ACCESS_TOKEN_PANADERIA_LA_ESPIGA: ${{ secrets.IG_ACCESS_TOKEN_PANADERIA_LA_ESPIGA }}
          IG_USER_ID_PANADERIA_LA_ESPIGA: ${{ secrets.IG_USER_ID_PANADERIA_LA_ESPIGA }}
          IG_ACCESS_TOKEN_PRUEBA_FLORISTERIA: ${{ secrets.IG_ACCESS_TOKEN_PRUEBA_FLORISTERIA }}
          IG_USER_ID_PRUEBA_FLORISTERIA: ${{ secrets.IG_USER_ID_PRUEBA_FLORISTERIA }}
          IG_ACCESS_TOKEN_TALLER_HERMANOS_RUIZ: ${{ secrets.IG_ACCESS_TOKEN_TALLER_HERMANOS_RUIZ }}
          IG_USER_ID_TALLER_HERMANOS_RUIZ: ${{ secrets.IG_USER_ID_TALLER_HERMANOS_RUIZ }}
          # <<< secretos
        run: python motor/todos.py publicar --simular
      - name: Estado del contenido
        run: python motor/tandas.py estado
