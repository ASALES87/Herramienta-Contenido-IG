name: Tokens (Instagram de cada cliente y GH_PAT)

# Lunes y jueves: renueva el token de Instagram de los clientes a los que les quedan 20 días o menos
# y lo guarda en Secrets (IG_ACCESS_TOKEN_<CLIENTE>). Avisa por GitHub (te llega por email) si alguno falla
# o si se acerca la caducidad del GH_PAT (variable GH_PAT_CADUCA).
on:
  schedule:
    - cron: "17 5 * * 1,4"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Renovar todos aunque no toque"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: tokens
  cancel-in-progress: false

jobs:
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Renovar tokens de Instagram que toquen
        env:
          FORZAR: ${{ inputs.forzar }}
          # >>> secretos (generado por motor/todos.py secretos; no editar a mano)
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          IG_ACCESS_TOKEN_CLINICA_FISIO_MAR: ${{ secrets.IG_ACCESS_TOKEN_CLINICA_FISIO_MAR }}
          IG_USER_ID_CLINICA_FISIO_MAR: ${{ secrets.IG_USER_ID_CLINICA_FISIO_MAR }}
          IG_ACCESS_TOKEN_DEMO: ${{ secrets.IG_ACCESS_TOKEN_DEMO }}
          IG_USER_ID_DEMO: ${{ secrets.IG_USER_ID_DEMO }}
          IG_ACCESS_TOKEN_PANADERIA_LA_ESPIGA: ${{ secrets.IG_ACCESS_TOKEN_PANADERIA_LA_ESPIGA }}
          IG_USER_ID_PANADERIA_LA_ESPIGA: ${{ secrets.IG_USER_ID_PANADERIA_LA_ESPIGA }}
          IG_ACCESS_TOKEN_PRUEBA_FLORISTERIA: ${{ secrets.IG_ACCESS_TOKEN_PRUEBA_FLORISTERIA }}
          IG_USER_ID_PRUEBA_FLORISTERIA: ${{ secrets.IG_USER_ID_PRUEBA_FLORISTERIA }}
          IG_ACCESS_TOKEN_TALLER_HERMANOS_RUIZ: ${{ secrets.IG_ACCESS_TOKEN_TALLER_HERMANOS_RUIZ }}
          IG_USER_ID_TALLER_HERMANOS_RUIZ: ${{ secrets.IG_USER_ID_TALLER_HERMANOS_RUIZ }}
          # <<< secretos
        run: |
          if [ "$FORZAR" = "true" ]; then python motor/tokens.py renovar-todos --dir "$RUNNER_TEMP/tok" --forzar
          else python motor/tokens.py renovar-todos --dir "$RUNNER_TEMP/tok"; fi

      - name: Guardar los tokens nuevos en Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/tok/IG_ACCESS_TOKEN_*; do
            gh secret set "$(basename "$f")" --repo "$GITHUB_REPOSITORY" < "$f"
            echo "✓ $(basename "$f") actualizado"
          done
          rm -rf "$RUNNER_TEMP/tok"/IG_ACCESS_TOKEN_*

      - name: Guardar fechas de caducidad
        run: |
          git config user.name "contenido-bot"
          git config user.email "contenido-bot@users.noreply.github.com"
          git add clientes/*/content/token.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Tokens renovados [skip ci]" && git pull --rebase -q && git push)

      - name: Avisar si algún token no se pudo renovar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/tok/fallos.md" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "⚠️ Token de Instagram sin renovar ($(TZ=Europe/Madrid date '+%d/%m'))" --body-file "$RUNNER_TEMP/tok/fallos.md"
          fi

      - name: Caducidad del GH_PAT
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT_CADUCA: ${{ vars.GH_PAT_CADUCA }}
        run: |
          python motor/tokens.py aviso-pat --out "$RUNNER_TEMP/pat.md"
          if [ -s "$RUNNER_TEMP/pat.md" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "🔑 El GH_PAT caduca pronto" --body-file "$RUNNER_TEMP/pat.md"
          fi
