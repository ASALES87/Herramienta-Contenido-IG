name: Publicar en Instagram (todos los clientes)

# Lo lanza un LANZADOR EXTERNO EXACTO (cron-job.org) a las horas de los clientes, con una llamada a la API de GitHub:
#   POST https://api.github.com/repos/<usuario>/Herramienta-Contenido-IG/actions/workflows/publicar.yml/dispatches
#   body {"ref":"main","inputs":{"modo":"programado"}}
# Un solo lanzador para todos los clientes: esta ejecución recorre los activos y publica lo que toca a cada uno
# (como mucho 1 por cliente y pasada). El cron de GitHub de abajo queda solo como RESPALDO (puede llegar con horas
# de retraso o no lanzarse). Si nada está pendiente, termina en segundos sin instalar nada.
# Solo publica clientes activos (plan.json → "activo": true) y nunca tandas pendientes de aprobación.
# Lo que llega más de plan.json → retraso_max_horas tarde no se publica: pasa al siguiente hueco libre y se avisa.
# Las horas se regeneran con:  python motor/todos.py horarios --escribir   (lo hace alta.py al dar de alta)
on:  python motor/todos.py horarios --escribir   (lo hace alta.py al dar de alta)
on:
  schedule:
    # >>> horarios (generado por motor/todos.py horarios; no editar a mano)
    - cron: "5 6,7 * * *"   # 08:00 Madrid
    - cron: "5 8,9 * * *"   # 10:00 Madrid
    - cron: "5 10,11 * * *"   # 12:00 Madrid
    - cron: "35 11,12 * * *"   # 13:30 Madrid
    # <<< horarios
  workflow_dispatch:
    inputs:
      modo:
        description: "simular = no publica nada (incluye clientes de ensayo) · publicar_siguiente = publica YA la siguiente del cliente indicado · programado = lo usa el lanzador externo"
        type: choice
        options: [simular, publicar_siguiente, programado]
        default: simular
      cliente:
        description: "id del cliente (vacío = todos; obligatorio para publicar_siguiente)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # >>> secretos (generado por motor/todos.py secretos; no editar a mano)
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      IG_ACCESS_TOKEN_CLINICA_FISIO_MAR: ${{ secrets.IG_ACCESS_TOKEN_CLINICA_FISIO_MAR }}
      IG_USER_ID_CLINICA_FISIO_MAR: ${{ secrets.IG_USER_ID_CLINICA_FISIO_MAR }}
      IG_ACCESS_TOKEN_DEMO: ${{ secrets.IG_ACCESS_TOKEN_DEMO }}
      IG_USER_ID_DEMO: ${{ secrets.IG_USER_ID_DEMO }}
      IG_ACCESS_TOKEN_PANADERIA_LA_ESPIGA: ${{ secrets.IG_ACCESS_TOKEN_PANADERIA_LA_ESPIGA }}
      IG_USER_ID_PANADERIA_LA_ESPIGA: ${{ secrets.IG_USER_ID_PANADERIA_LA_ESPIGA }}
      IG_ACCESS_TOKEN_PRUEBA_FLORISTERIA: ${{ secrets.IG_ACCESS_TOKEN_PRUEBA_FLORISTERIA }}
      IG_USER_ID_PRUEBA_FLORISTERIA: ${{ secrets.IG_USER_ID_PRUEBA_FLORISTERIA }}
      IG_ACCESS_TOKEN_TALLER_HERMANOS_RUIZ: ${{ secrets.IG_ACCESS_TOKEN_TALLER_HERMANOS_RUIZ }}
      IG_USER_ID_TALLER_HERMANOS_RUIZ: ${{ secrets.IG_USER_ID_TALLER_HERMANOS_RUIZ }}
      # <<< secretos
    steps:
      # Siempre la última versión de main: published.json al día (nunca duplicar)
      - uses: actions/checkout@v5
        with:
          ref: main

      # Antes de instalar nada: si no hay nada pendiente, termina aquí (ahorra minutos de Actions)
      - name: ¿Hay algo pendiente?
        id: pend
        env:
          MODO: ${{ inputs.modo }}
        run: |
          if [ "$MODO" = "simular" ] || [ "$MODO" = "publicar_siguiente" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            hay=$(python3 motor/todos.py pendiente)   # si falla, la ejecución sale en rojo (y avisa)
            echo "hay=$hay" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.pend.outputs.hay == 'si'
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        if: steps.pend.outputs.hay == 'si'
        run: pip install -r requirements.txt

      - name: Instalar ffmpeg (solo si hay un reel a punto)
        if: steps.pend.outputs.hay == 'si'
        env:
          MODO: ${{ inputs.modo }}
        run: |
          if [ "$(python motor/todos.py hay-reels)" = "si" ] || [ "$MODO" = "publicar_siguiente" ]; then
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          fi

      - name: Publicar lo que toca
        if: steps.pend.outputs.hay == 'si'
        env:
          MODO: ${{ inputs.modo }}
          CLIENTE_ELEGIDO: ${{ inputs.cliente }}
          AVISOS_FILE: ${{ runner.temp }}/avisos.md
        run: |
          git config user.name "contenido-bot"
          git config user.email "contenido-bot@users.noreply.github.com"
          if [ "$MODO" = "simular" ]; then
            if [ -n "$CLIENTE_ELEGIDO" ]; then python motor/todos.py publicar --simular --cliente "$CLIENTE_ELEGIDO"
            else python motor/todos.py publicar --simular; fi
          elif [ "$MODO" = "publicar_siguiente" ]; then
            python motor/todos.py siguiente --cliente "$CLIENTE_ELEGIDO" --commit
          else
            # programado (lanzador externo) o cron de respaldo: commit de published.json justo después de cada cliente
            python motor/todos.py publicar --commit
          fi

      - name: Guardar registro (publicados, fotos y diseño decididos)
        if: always() && steps.pend.outputs.hay == 'si'
        run: |
          git config user.name "contenido-bot"
          git config user.email "contenido-bot@users.noreply.github.com"
          for f in clientes/*/content/published.json clientes/*/content/reprogramados.json clientes/*/content/videos_usados.json \
                   clientes/*/content/fotos_asignadas.json clientes/*/content/diseno.json clientes/*/biblioteca/index.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || (git commit -m "Publicado en Instagram [skip ci]" && git pull --rebase -q && git push)

      - name: Avisar de publicaciones reprogramadas por retraso
        if: always() && steps.pend.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          AVISOS_FILE: ${{ runner.temp }}/avisos.md
        run: |
          if [ -s "$AVISOS_FILE" ]; then
            printf '%s\n\n%s\n' "Han llegado tarde y NO se han publicado fuera de hora; pasan al siguiente hueco libre:" \
              "$(cat "$AVISOS_FILE")" > "$RUNNER_TEMP/aviso_retraso.md"
            echo "Ejecución: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$RUNNER_TEMP/aviso_retraso.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "🕒 Publicaciones reprogramadas por retraso ($(TZ=Europe/Madrid date '+%d/%m %H:%M'))" \
              --body-file "$RUNNER_TEMP/aviso_retraso.md"
          fi

      - name: Avisar si ha fallado
        if: failure() && (github.event_name == 'schedule' || inputs.modo == 'programado')
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGEN: ${{ github.event_name == 'schedule' && 'cron de GitHub (respaldo)' || 'lanzador externo (cron-job.org)' }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "⚠️ Falló una publicación ($(TZ=Europe/Madrid date '+%d/%m %H:%M'))" \
            --body "Origen: $ORIGEN
          Detalle: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Lo pendiente se reintenta en la siguiente franja (y si llega más de retraso_max_horas tarde, pasa al siguiente hueco libre).
          Cierra este aviso cuando esté resuelto."
