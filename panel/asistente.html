<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistente de Alta IG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna única de formulario guiado; barra de progreso por pasos; panel interno plegable al final */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --fg:#1A1E2B; --muted:#5E6577; --line:#DADDE5;
  --accent:#C2185B; --accent-soft:#FBE4EE; --sol:#0E6B63; --sol-soft:#DFF3F0;
  --warn:#9A5B00; --warn-soft:#FDF0D8; --bad:#B42318; --bad-soft:#FDE6E4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141B; --surface:#1B1E28; --fg:#ECEEF3; --muted:#A3A9B8; --line:#2E3342;
  --accent:#F06292; --accent-soft:#3A1E2B; --sol:#5FD3C4; --sol-soft:#163330;
  --warn:#F2B552; --warn-soft:#3A2C12; --bad:#FF8A80; --bad-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141B; --surface:#1B1E28; --fg:#ECEEF3; --muted:#A3A9B8; --line:#2E3342;
  --accent:#F06292; --accent-soft:#3A1E2B; --sol:#5FD3C4; --sol-soft:#163330;
  --warn:#F2B552; --warn-soft:#3A2C12; --bad:#FF8A80; --bad-soft:#3B1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{font:800 22px/1.1 var(--display);letter-spacing:-.01em}
.brand small{display:block;font:500 13px var(--body);color:var(--muted);letter-spacing:0}
.mode{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 10px;border-radius:99px;cursor:pointer}
.mode[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.progress{display:flex;gap:4px;margin-bottom:8px}
.progress span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--accent)}
.steplabel{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:18px}
h1{font:800 clamp(26px,5vw,36px)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
h2{font:700 20px/1.25 var(--display);margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 24px;max-width:62ch}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.q label.t{display:block;font-weight:600;margin-bottom:4px}
.q .h{color:var(--muted);font-size:14px;margin:0 0 10px}
.q .req{color:var(--accent)}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:500 15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;text-align:left}
.opt small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opts.cards .opt{flex:1 1 180px}
.sol{margin-top:12px;background:var(--sol-soft);border-radius:8px;padding:10px 12px;font-size:14.5px}
.sol b{color:var(--sol);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.08em;display:block;margin-bottom:2px}
.sol.warn{background:var(--warn-soft)} .sol.warn b{color:var(--warn)}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{font:600 15px var(--body);border-radius:8px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.crow{display:flex;align-items:center;gap:10px;min-width:0}
.cpick{position:relative;width:46px;height:46px;flex:none;border-radius:8px;border:1px solid var(--line);cursor:pointer;overflow:hidden}
.cpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.cpick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.cfield{display:grid;gap:2px;min-width:0;flex:1}
.clab{font-size:13px;color:var(--muted);font-weight:600}
.cfield input{font:14px var(--mono)!important;padding:7px 9px!important;text-transform:uppercase}
.cfield input.bad{border-color:var(--bad)}
.swb{cursor:pointer;padding:0}
.swb:hover{transform:scale(1.08)}
.swatches{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:6px;border:1px solid var(--line)}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(270px,100%);margin-top:10px}
.mosaic div{aspect-ratio:4/5;border-radius:2px;display:flex;align-items:center;justify-content:center;font:800 20px var(--display)}
.mosaic .foto{background:linear-gradient(160deg,#d8b48c 0%,#a7835f 45%,#6d5440 100%);position:relative;align-items:flex-end}
.mosaic .foto span{display:block;width:100%;height:38%;font:800 16px var(--display);display:flex;align-items:center;justify-content:center}
.logo-prev{max-height:72px;margin-top:10px;border-radius:6px;border:1px solid var(--line);background:#fff;padding:4px}
.connect{border:1px dashed var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.connect .fake{font:600 14px var(--body);border-radius:8px;padding:9px 14px;background:var(--fg);color:var(--bg);opacity:.55}
/* diagnóstico */
.diag{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sol);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.item.accion{border-left-color:var(--warn)} .item.bloqueo{border-left-color:var(--bad)}
.item .area{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pill{font:600 11px var(--body);padding:2px 8px;border-radius:99px;background:var(--sol-soft);color:var(--sol);letter-spacing:.04em}
.item.accion .pill{background:var(--warn-soft);color:var(--warn)} .item.bloqueo .pill{background:var(--bad-soft);color:var(--bad)}
.item .s{color:var(--muted);font-size:14.5px}
.plan{background:var(--fg);color:var(--bg);border-radius:12px;padding:18px 20px;margin:18px 0}
.plan h2{color:var(--bg)}
.plan .row{display:flex;gap:24px;flex-wrap:wrap;margin-top:10px}
.plan .n{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.plan .l{font-size:13px;opacity:.75}
ol.next{padding-left:22px;margin:8px 0 0} ol.next li{margin-bottom:6px}
.status{display:inline-block;font:700 13px var(--body);padding:4px 10px;border-radius:99px;margin-bottom:12px}
.status.ok{background:var(--sol-soft);color:var(--sol)} .status.no{background:var(--bad-soft);color:var(--bad)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
pre.json{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 var(--mono);overflow:auto;max-height:320px;white-space:pre}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.intern{border-top:2px solid var(--fg);margin-top:32px;padding-top:18px}
.intern h2{display:flex;align-items:center;gap:8px}
.tag{font:700 11px var(--body);background:var(--fg);color:var(--bg);padding:2px 8px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
.cl label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.cl input{margin-top:4px;accent-color:var(--accent);flex:none}
code{font:13px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;word-break:break-all}
.ans{padding:14px 16px}
.anshead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.anshead h3{font:700 16px var(--display);margin:0}
.ans dl{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:6px 14px;margin:0;font-size:14.5px}
.ans dt{color:var(--muted)} .ans dd{margin:0;overflow-wrap:anywhere}
.ans dd.empty{color:var(--bad)} .ans dd.none{color:var(--muted);font-style:italic}
@media (max-width:520px){.ans dl{grid-template-columns:1fr;gap:0}.ans dd{margin-bottom:8px}}
.opts.estilos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.opts.cards.estilos .opt{padding:8px;min-width:0}
.mk{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;margin-bottom:8px}
.mkph{position:absolute;left:0;right:0;top:0}
.mkgr{position:absolute;inset:0}
.mkchip{position:absolute;left:9%;top:9%;width:34%;height:6%;border-radius:9px}
.mkline{position:absolute;left:9%;top:12%;width:22%;height:2%}
.mkdots{position:absolute;right:8%;top:8%;display:flex;gap:3px}.mkdots u{width:9px;height:9px;border-radius:50%;display:block}
.mkt{position:absolute;left:9%;right:9%;top:36%;display:grid;gap:5px}.mkt i{display:block;height:9px;border-radius:3px}.mkt.big i{height:14px}
.mkname{display:block;font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.sendbox{border:2px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px}
.example{font-size:13px;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion: no-preference){.q,.item{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head><body>

<div class="wrap">
  <header class="top">
    <div class="brand">Alta de Instagram <small>Contenido en piloto automático para tu negocio</small></div>
    <button class="mode" id="modeBtn" aria-pressed="false" type="button">Modo interno</button>
  </header>
  <div class="progress" id="progress"></div>
  <div class="steplabel" id="steplabel"></div>
  <main id="app"></main>
  <section id="internal" class="intern" hidden></section>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
/* ===== Configuración (cámbiala antes de enviar el enlace a clientes) ===== */
const CONFIG = {
  servicio: "Contenido IG",                 // nombre comercial provisional
  emailContacto: "tu-email@tudominio.com",  // dónde te mandan la ficha
  version: "0.1"
};

/* ===== Datos de apoyo ===== */
const SECTORES = [
  {v:"comercio",l:"Comercio / tienda física"},
  {v:"restauracion",l:"Restauración / cafetería"},
  {v:"salud",l:"Clínica / salud",tip:"Las publicaciones sobre salud las validarás tú antes de salir: nada de afirmaciones médicas sin tu visto bueno.",warn:true},
  {v:"estetica",l:"Estética / peluquería"},
  {v:"academia",l:"Academia / formación"},
  {v:"taller",l:"Taller / servicios técnicos"},
  {v:"online",l:"Tienda online"},
  {v:"otro",l:"Otro"}
];
const PALETAS = { // principal, fondo, acento, texto
  comercio:["#1F4E79","#F4F7FB","#E3A72F","#1D2330"],
  restauracion:["#7A3B1F","#FBF4EC","#D9822B","#2A1E17"],
  salud:["#0F6C7A","#F2F8F9","#7BC4B8","#18323A"],
  estetica:["#8C3B5E","#FBF2F5","#D8A48F","#2C1C24"],
  academia:["#2C3E8C","#F4F5FB","#F2B134","#1C2240"],
  taller:["#263238","#F2F3F4","#E85D04","#16191C"],
  online:["#4A2C82","#F6F3FB","#2EC4B6","#1E1830"],
  otro:["#2F4858","#F5F7F7","#F26419","#1B2A33"]
};
const PILARES = {
  _base:["Lo que hacemos","Consejos útiles","Mitos y errores frecuentes","Equipo y día a día","Clientes y opiniones","Novedades y fechas clave"],
  restauracion:["La carta y el plato estrella","Detrás de la cocina","Mitos y curiosidades","Producto y proveedores","Clientes y momentos","Eventos y fechas"],
  salud:["Tratamientos y servicios","Consejos de prevención","Mitos y errores frecuentes","El equipo","Preguntas frecuentes","Novedades del centro"],
  estetica:["Antes y después","Tendencias","Consejos de cuidado","Equipo y día a día","Clientas y clientes","Ofertas y fechas"],

  online:["Producto estrella","Cómo se usa","Consejos y mitos","Detrás de la marca","Opiniones","Lanzamientos y ofertas"]

// nombre corto de la destacada de cada pilar (cabe en el círculo del perfil)
const DEST_CORTO={"Lo que hacemos":"Qué hacemos","Consejos útiles":"Consejos","Mitos y errores frecuentes":"Mitos","Equipo y día a día":"Equipo",
  "Clientes y opiniones":"Clientes","Novedades y fechas clave":"Novedades","La carta y el plato estrella":"La carta","Detrás de la cocina":"Cocina",
  "Mitos y curiosidades":"Curioso","Producto y proveedores":"Producto","Clientes y momentos":"Clientes","Eventos y fechas":"Eventos",

  "Clientas y clientes":"Clientes","Ofertas y fechas":"Ofertas","Cursos y grupos":"Cursos","Consejos de estudio":"Consejos",
  "Errores frecuentes":"Errores","Profesores y día a día":"Profes","Logros del alumnado":"Logros","Plazos y matrículas":"Matrícula",
  "Producto estrella":"Producto","Cómo se usa":"Cómo se usa","Consejos y mitos":"Consejos","Detrás de la marca":"Nosotros",
  "Opiniones":"Opiniones","Lanzamientos y ofertas":"Novedades"};
const ESTILOS = [
  {v:"bloques",l:"Bloques de color",d:"Diseño con tus colores. No necesita fotos."},
  {v:"tipografica",l:"Tipográfica",d:"Sobria y elegante, letra grande."},
  {v:"foto_franja",l:"Foto con franja",d:"Tu foto arriba y el título en una franja de color."},
  {v:"foto_completa",l:"Foto completa",d:"La foto ocupa todo y el título va encima."},
  {v:"foto_marco",l:"Foto enmarcada",d:"La foto enmarcada sobre tu color."}
];
const esFotoEstilo = v => v.startsWith("foto");
const PATRONES={muchas:[1,1,1,0],mitad:[1,0],pocas:[1,0,0,0],ninguna:[0]};
function nivelFotos(d){
  const est=d.estilos||estilosRecomendados(d);
  if(!est.some(esFotoEstilo)) return "ninguna";
  if(d.fotos==="muchas"||d.fotosNuevas==="semana") return "muchas";
  if(d.fotos==="algunas"||d.fotosNuevas==="mes") return d.preferencia==="stock"?"mitad":"mitad";
  return d.preferencia==="propias"?"ninguna":"pocas";   // sin fotos propias: algo de stock, sin abusar
}
function estilosRecomendados(d){
  if(d.fotos==="muchas"||d.fotosNuevas==="semana") return ["foto_franja","bloques"];
  if(d.fotos==="algunas"||d.fotosNuevas==="mes") return ["foto_marco","bloques"];
  return ["bloques","tipografica"];
}
const RITMOS = {
  basico:{l:"Básico",car:3,reels:1,hist:"3 por semana"},
  estandar:{l:"Estándar",car:5,reels:2,hist:"1 al día"},
  intenso:{l:"Intenso",car:7,reels:3,hist:"1 al día"}
};

/* ===== Pasos y preguntas ===== */
const yes = v => v==="si_usa"||v==="si_abandonada";
const STEPS = [
 {id:"inicio",titulo:"Bienvenida",intro:true},
 {id:"negocio",titulo:"Tu negocio",lead:"Con esto sabremos de qué hablar en tus publicaciones.",fields:[
  {id:"nombre",type:"text",label:"Nombre comercial",req:true,ph:"Panadería La Espiga"},
  {id:"sector",type:"choice",label:"Sector",req:true,options:SECTORES},
  {id:"actividad",type:"text",label:"¿A qué te dedicas, en una frase?",req:true,ph:"Pan de masa madre y bollería artesana en Ruzafa"},
  {id:"zona",type:"choice",label:"¿A quién atiendes?",req:true,options:[
    {v:"local",l:"Mi barrio o ciudad",tip:"Usaremos ubicación y temas locales (fiestas, barrio) para que te encuentren cerca."},
    {v:"provincia",l:"Mi provincia"},{v:"espana",l:"Toda España"},
    {v:"online",l:"Solo online",tip:"Daremos más peso a enlaces y producto, y menos a la ubicación."}]},
  {id:"estrella",type:"textarea",label:"Tus 3 productos o servicios estrella",req:true},
  {id:"diferencia",type:"textarea",label:"¿Qué te diferencia de la competencia?"},
  {id:"web",type:"text",label:"Web (si tienes)",ph:"https://"}
 ]},
 {id:"instagram",titulo:"Tu Instagram",lead:"Partimos de donde estés. Si no tienes cuenta, no pasa nada.",fields:[
  {id:"tieneIG",type:"choice",cards:true,label:"¿Tienes Instagram para el negocio?",req:true,options:[
    {v:"si_usa",l:"Sí, y publico",d:"Aunque sea de vez en cuando"},
    {v:"si_abandonada",l:"Sí, pero está parada",d:"Hace meses que no publico",tip:"La reactivamos: primero ordenamos el perfil (foto, biografía, destacadas) y después arranca el calendario."},
    {v:"no",l:"No tengo",d:"Empezamos de cero",tip:"La creamos contigo como cuenta profesional en la videollamada de alta. Solo necesitas el móvil y un email."}]},
  {id:"usuario",type:"text",label:"Tu @ de Instagram",req:true,ph:"@tunegocio",show:d=>yes(d.tieneIG)},
  {id:"usuarioDeseado",type:"text",label:"¿Qué @ te gustaría?",ph:"@tunegocio",h:"Comprobaremos que esté libre y te propondremos alternativas si no.",show:d=>d.tieneIG==="no"},
  {id:"tipoCuenta",type:"choice",label:"¿Qué tipo de cuenta es?",h:"Lo ves en Configuración → Tipo de cuenta y herramientas.",req:true,show:d=>yes(d.tieneIG),options:[
    {v:"empresa",l:"Profesional · Empresa",tip:"Perfecto: es el tipo de cuenta que necesitamos para publicar de forma automática."},
    {v:"creador",l:"Profesional · Creador",tip:"Sirve igual. Si quieres, la pasamos a Empresa para tener botones de contacto."},
    {v:"personal",l:"Personal",tip:"La pasamos a profesional en 2 minutos durante el alta. No pierdes seguidores ni publicaciones.",warn:true},
    {v:"nose",l:"No lo sé",tip:"Lo comprobamos juntos en la videollamada."}]},
  {id:"seguidores",type:"choice",label:"Seguidores aproximados",show:d=>yes(d.tieneIG),options:[
    {v:"<300",l:"Menos de 300"},{v:"300-1000",l:"300 a 1.000"},{v:"1000-5000",l:"1.000 a 5.000"},{v:">5000",l:"Más de 5.000"}]},
  {id:"paginaFB",type:"choice",label:"¿Tienes página de Facebook del negocio?",options:[
    {v:"vinculada",l:"Sí, vinculada a Instagram"},
    {v:"suelta",l:"Sí, pero no vinculada",tip:"Las vinculamos en el alta; así luego podemos publicar también en Facebook si lo quieres."},
    {v:"no",l:"No",tip:"No es imprescindible para empezar. Si hiciera falta para la conexión, la creamos vacía en un minuto."},
    {v:"nose",l:"No lo sé"}]},
  {id:"otrasRedes",type:"multi",label:"¿Usas otras redes o perfiles?",h:"Por ahora trabajamos Instagram; lo apuntamos para más adelante.",options:[
    {v:"facebook",l:"Facebook"},{v:"tiktok",l:"TikTok"},{v:"linkedin",l:"LinkedIn"},{v:"google",l:"Ficha de Google"},{v:"whatsapp",l:"WhatsApp Business"}]}
 ]},

/* ===== Lógica de recomendación ===== */
function slug(s){return String(s||"cliente").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||"cliente";}
function ritmoRecomendado(d){
  let p = 1; // 0 básico, 1 estándar, 2 intenso
  if(d.objetivo==="ventas"||d.objetivo==="notoriedad") p++;
  if(d.zona==="local"&&d.objetivo==="reservas") p--;
  if(d.tieneIG==="no") p=Math.min(p,1);
  return ["basico","estandar","intenso"][Math.max(0,Math.min(2,p))];
}
function paleta(d){
  if((d.tieneColores==="si"||d.tieneColores==="logo")&&d.colores) return d.colores;
  const base = PALETAS[d.sector]||PALETAS.otro;
  return {principal:base[0],fondo:base[1],acento:base[2],texto:base[3]};
}
function pctPropio(d){ return {muchas:75,mitad:50,pocas:25,ninguna:0}[nivelFotos(d)]; }
function tiempoCliente(d){
  let m=0;
  if(d.aprobacion==="cada") m+=10;
  m+=15; // contestar comentarios
  if(d.fotosNuevas==="semana") m+=10; else if(d.fotosNuevas==="mes") m+=3;
  return m;
}
function diagnostico(d){
  const out=[];
  const it=(area,estado,situacion,solucion)=>out.push({area,estado,situacion,solucion});
  // Cuenta
  if(d.tieneIG==="no") it("Cuenta de Instagram","accion","No tienes cuenta todavía.",`La creamos como cuenta profesional${d.usuarioDeseado?` con el nombre ${d.usuarioDeseado}`:""} en la videollamada de alta.`);
  else if(d.tipoCuenta==="personal") it("Cuenta de Instagram","accion","Tu cuenta es personal.","La pasamos a profesional en el alta. No pierdes seguidores ni publicaciones.");
  else if(d.tipoCuenta==="nose") it("Cuenta de Instagram","accion","No sabemos aún el tipo de cuenta.","Lo comprobamos en la videollamada y, si hace falta, la pasamos a profesional.");
  else if(d.tieneIG==="si_abandonada") it("Cuenta de Instagram","ok","Tienes cuenta profesional, pero está parada.","Renovamos foto, biografía y destacadas antes de arrancar el calendario.");
  else it("Cuenta de Instagram","ok","Cuenta profesional activa.","Lista para conectar.");
  // Acceso
  if(!d.okConexion) it("Conexión","bloqueo","Falta tu conformidad con la conexión oficial.","Vuelve al paso «Conexión segura» y marca la casilla.");
  else if(d.quienAcceso==="otra") it("Conexión","accion","La cuenta la lleva otra persona o una agencia.","Te damos el mensaje para pedirle el acceso. Sin eso no podemos conectar.");
  else if(d.quienAcceso==="perdido") it("Conexión","accion","No recuerdas la contraseña.","Recupérala antes de la videollamada desde «¿Has olvidado la contraseña?».");
  else it("Conexión","ok","Conexión con el inicio de sesión oficial de Meta.","Se hace en 20 minutos por videollamada. Nunca guardamos tu contraseña.");
  // Marca
  const p=paleta(d);
  if(d.tieneLogo==="si"&&!d.logo) it("Marca","accion","Tienes logo, pero no lo has subido.","Envíanoslo en PNG por email antes del alta.");
  else if(d.tieneLogo==="no") it("Marca","ok","Sin logo.","Usaremos tu nombre con una tipografía cuidada y tus colores.");
  else it("Marca","ok","Logo recibido.","Lo usamos en portadas, historias y destacadas.");
  it("Colores","ok",d.tieneColores==="si"?"Usaremos tus colores.":d.tieneColores==="logo"?"Colores sacados de tu logo.":"Paleta propuesta según tu sector.",`Principal ${p.principal}, fondo ${p.fondo}, acento ${p.acento}.`);
  // Material
  const pct=pctPropio(d);
  it("Fotos","ok",
    d.fotos==="no"?"No tienes fotos propias.":d.fotos==="muchas"?"Tienes muchas fotos propias.":"Tienes algunas fotos propias.",
    (pct?`${pct}% de las publicaciones con foto${d.fotos==="no"&&d.fotosNuevas==="no"?" (imágenes de stock con licencia comercial)":""}; el resto, diseño con tus colores.`:"Diseño con tus colores; si algún día nos mandas fotos, las incorporamos.")+(d.fotosNuevas&&d.fotosNuevas!=="no"?" Recibirás el enlace «Enviar foto» para el móvil.":""));
  const est=d.estilos||estilosRecomendados(d);
  it("Estilo","ok",`Plantillas: ${est.map(x=>(ESTILOS.find(o=>o.v===x)||{l:x}).l).join(" + ")}.`,
    ({muchas:"3 de cada 4 publicaciones con foto (dos fotos por carrusel).",mitad:"1 de cada 2 con foto: tablero de ajedrez foto / color.",
      pocas:"1 de cada 4 con foto"+(d.fotos==="no"?" (de stock con licencia mientras no nos mandes tuyas)":"")+"; el resto, diseño con tus colores.",
      ninguna:"Todo diseño con tus colores, sin depender de fotos."})[nivelFotos(d)]+(nivelFotos(d)!=="ninguna"?" Si llegan menos fotos, se ajusta solo.":""));
  it("Reels","ok",
    d.videos==="si"?"Puedes grabar vídeos.":d.videos==="alguno"?"Puedes grabar algún vídeo.":"No vas a grabar vídeos.",
    d.videos==="no"?"Reels de 30 s con vídeo de stock, tus textos y música libre. No sales en cámara.":"Tus vídeos se usan primero; el resto con stock y música libre.");
  // Sensibles
  if(d.sector==="salud") it("Contenido sensible","accion","Sector salud.","Las afirmaciones sanitarias se publican solo con tu validación.");
  if(d.aprobacion==="no"&&d.sector==="salud") it("Aprobación","accion","Pides que salga sin revisar, pero tu sector es sensible.","Te recomendamos al menos revisar la primera tanda.");
  return out;
}
function listo(d){ return diagnostico(d).every(x=>x.estado!=="bloqueo"); }

function buildRespuestas(){
  const d=S.d; const r={_meta:{servicio:CONFIG.servicio,version:CONFIG.version,fecha:new Date().toISOString()}};
  if(d.logoPaleta) r.logoPaleta=d.logoPaleta.extra;
  STEPS.forEach(st=>(st.fields||[]).forEach(f=>{ if(f.id[0]!=="_"&&d[f.id]!==undefined&&visible(f)) r[f.id]=d[f.id]; }));
  r.ritmo = d.ritmo||ritmoRecomendado(d);
  r.estilos = d.estilos||estilosRecomendados(d);
  r.paleta = paleta(d);
  r._marca = buildMarca();   // lo usa alta/alta.py tal cual (mismo esquema que el motor)
  r._plan = buildPlan();
  r._diagnostico = diagnostico(d);
  return r;
}
const VIDEO_Q={comercio:"small shop owner customers",restauracion:"restaurant kitchen cooking",salud:"clinic friendly professional",estetica:"beauty salon hair styling",academia:"students classroom learning",taller:"mechanic workshop tools",online:"package shipping small business",otro:"small business owner working"};
function buildMarca(){
  // Mismo esquema que clientes/<id>/marca.json del motor (Herramienta-Contenido-IG)
  const d=S.d, id=slug(d.nombre), pil=(PILARES[d.sector]||PILARES._base);
  const pilares={}, dest={}, sub={};
  pil.forEach((p,i)=>{ const k="P"+(i+1); pilares[k]=p; dest[k]=DEST_CORTO[p]||p.split(" ").find(w=>w.length>3)||p; });
  const kq="P"+(pil.length+1); pilares[kq]="Tu turno"; dest[kq]="Tu turno"; sub["Tu turno"]="preguntas";
  const ctas={whatsapp:"Escríbenos por WhatsApp",bio:"Más info en el enlace de la bio",reservar:"Reserva tu cita",comprar:"Compra online",llamar:"Llámanos",visitar:"Te esperamos en el local"};
  return {
    id, nombre:d.nombre||"", instagram:(d.usuario||d.usuarioDeseado||"").replace(/^@/,""), sector:d.sector||"otro",
    colores:paleta(d),
    fuentes:d.tipografia==="propia"?{titulo:"assets/fonts/Titulo.ttf",texto:"assets/fonts/Texto.ttf",texto_semi:"assets/fonts/Texto.ttf"}
      :{titulo:"Quicksand.ttf",texto:"Poppins-Regular.ttf",texto_semi:"Poppins-SemiBold.ttf",peso_titulo:700},
    logo:d.tieneLogo==="si"?"assets/logo.png":null, logo_claro:null, logo_texto:(d.nombre||"").toLowerCase(), logo_etiqueta:null,
    adorno:"puntos", plantillas:d.estilos||estilosRecomendados(d), fotos:{nivel:"auto",nivel_max:nivelFotos(d)}, pilares, pilar_pregunta:kq, destacadas:dest, destacadas_sub:sub, textos:{},
    cta_por_defecto:ctas[d.cta]||"", video_query_defecto:VIDEO_Q[d.sector]||VIDEO_Q.otro,
    idioma:"es-ES", tuteo:d.trato!=="usted",
    tono:d.tono||[], emojis:d.emojis||"pocos", hashtags:d.hashtags||"",
    contenido_propio:{fotos:d.fotos||"no",videos:d.videos||"no",preferencia:d.preferencia||(d.fotos==="no"?"stock":"mezcla"),fotos_nuevas:d.fotosNuevas||"no"},
    aprobacion_tandas:d.aprobacion!=="no", media_host:"r2", email_avisos:d.email||""
  };
}
function buildPlan(){
  // Mismo esquema que clientes/<id>/content/plan.json del motor
  const k=S.d.ritmo||ritmoRecomendado(S.d);
  const dias={basico:["lunes","miercoles","viernes"],estandar:["lunes","martes","miercoles","jueves","viernes"],intenso:["lunes","martes","miercoles","jueves","viernes","sabado","domingo"]}[k];
  const reels={basico:["jueves"],estandar:["martes","sabado"],intenso:["lunes","miercoles","sabado"]}[k];
  return {activo:false, ritmo:k,
    carrusel:{dias,hora:"13:30"}, dato:{hora:"08:00"}, pregunta:{activo:true,dia:"domingo",hora:"10:00"},
    reels:{activo:true,dias:reels,hora:"12:00",pilares:["P1","P2","P4"]},
    tanda:{dias_minimos_por_delante:21,dias_por_tanda:35}, aprobacion:S.d.aprobacion||"primera",
    mosaico:{activo:true,secuencia:["principal","fondo","principal","acento"],desfase:0}};
}
function resumenTexto(){
  const d=S.d, k=d.ritmo||ritmoRecomendado(d), r=RITMOS[k];
  let t=`ALTA ${CONFIG.servicio} — ${d.nombre||""}\n${d.actividad||""}\nInstagram: ${d.usuario||d.usuarioDeseado||"(sin cuenta)"}\nContacto: ${d.persona||""} · ${d.email||""} · ${d.telefono||""}\n\nPlan: ${r.l} — ${r.car} carruseles + ${r.reels} reels por semana, historias ${r.hist}\n\nDIAGNÓSTICO\n`;
  diagnostico(d).forEach(x=>{t+=`- [${x.estado.toUpperCase()}] ${x.area}: ${x.situacion} → ${x.solucion}\n`;});
  return t;
}

  if(d.tipoCuenta==="personal"||d.tipoCuenta==="nose") L.push(["pro","Comprobar tipo de cuenta y pasar a profesional"]);

  if(d.paginaFB==="suelta") L.push(["fb","Vincular página de Facebook con Instagram"]);
  L.push(["tester","Invitar la cuenta como tester de la app de Meta y que acepte la invitación"]);
  L.push(["token",`Generar token y guardar secrets <code>IG_ACCESS_TOKEN_${ID}</code> e <code>IG_USER_ID_${ID}</code> con <code>gh secret set</code>`]);
  if(d.tieneLogo==="si"&&!d.logo) L.push(["logo","Pedir el logo en PNG"]);
  if(d.tipografia==="propia") L.push(["fuente","Pedir archivos de la tipografía y revisar la licencia"]);

  if(d.fotosNuevas&&d.fotosNuevas!=="no") L.push(["enviar","Enviarle el enlace «Enviar foto» y pedirle que lo añada a la pantalla de inicio"]);
  if(d.sector==="salud") L.push(["salud","Marcar en GUIA_TANDAS.md: afirmaciones sanitarias solo con validación"]);

  L.push(["activar",`Poner <code>"activo": true</code> en <code>clientes/${id}/plan.json</code>`]);
  return L;

function valorLegible(f,v){

    case "multi": return v.map(x=>(f.options.find(o=>o.v===x)||{l:x}).l).join(", ");
    case "check": return v?"Sí":"";
    case "file": return v?"Subido":"";
    case "colors": return ["principal","fondo","acento","texto"].map(k=>`${k} ${v[k]}`).join(" · ");

const MM=72/25.4;

const W1252={"€":128,"‚":130,"„":132,"…":133,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151};
function pdfStr(t){
  t=String(t).replace(/→/g,"->").replace(/′/g," min").replace(/[​-‍﻿]/g,"");
  let o=""; for(const ch of t){ let c=ch.charCodeAt(0); if(W1252[ch]) c=W1252[ch]; else if(c>255) c=63;
    if(ch==="("||ch===")"||ch==="\\") o+="\\"+ch; else if(c<32||c>126) o+="\\"+c.toString(8).padStart(3,"0"); else o+=ch; }

}

  wrap(t,size,bold,maxMm){ const max=maxMm*MM, out=[]; String(t).split("\n").forEach(par=>{ let line=""; par.split(/\s+/).forEach(w=>{ const tst=line?line+" "+w:w; if(anchoPt(tst,size,bold)>max&&line){out.push(line);line=w;} else line=tst; }); out.push(line); }); return out; }

    this.pages.forEach((ops,i)=>{
      const pie=`BT /F1 8 Tf 0.4 0.42 0.47 rg ${(18*MM).toFixed(2)} ${(842-288*MM).toFixed(2)} Td ${pdfStr(`${CONFIG.servicio} · Resumen de alta · Página ${i+1} de ${N}`)} Tj ET`;
      const c=ops.concat(pie).join("\n"); const cid=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 842] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> ${xo} >> /Contents ${cid} 0 R >>`));
    });
    objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
    let out="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
    const xref=out.length;
    out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
    out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    return new Blob([bytes],{type:"application/pdf"});
  }
}

async function construirPDF(){

  [[r.car,"carruseles/sem"],[r.reels,"reels/sem"],[r.hist==="1 al día"?7:3,"historias/sem"],[tiempoCliente(d)+" min","su tiempo/sem"],[pctPropio(d)+"%","con foto"]]
    .forEach(([n,l],i)=>{ const x=M+5+i*34; pdf.text(x,y0+17,String(n),14,true,"#FFFFFF"); pdf.text(x,y0+22,l,7.5,false,"#C9CDD8"); });
  pdf.y=y0+32;

    pdf.para(M+4,x.situacion,9.5,false,"#5E6577",ANCHO-4); pdf.para(M+4,x.solucion,9.5,false,"#1A1E2B",ANCHO-4); pdf.y+=1; });

async function guardarArchivo(nombre,blob){
  if(window.self===window.top){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("Descargado: "+nombre); return; }
  const dl = window.claude&&window.claude.use ? await window.claude.use("downloads") : null;
  if(!dl){ toast("Aquí no se puede descargar. Abre el archivo del asistente en el navegador."); return; }
  try{ await dl.save({filename:nombre,data:blob}); toast("Guardado"); }
  catch(e){ if(e&&e.code==="declined") return; toast(e&&e.code==="rate_limited"?"Espera un momento y vuelve a pulsar":"No se pudo guardar el archivo"); }
}

/* ===== Validación y navegación ===== */
function validate(){
  const st=STEPS[S.step]; let ok=true, first=null;
  (st.fields||[]).filter(visible).forEach(f=>{
    if(!f.req) return;
    const v=S.d[f.id]; const empty = v===undefined||v===""||v===false||(Array.isArray(v)&&!v.length)||(typeof v==="string"&&!v.trim());
    const el=document.querySelector(`[data-field="${f.id}"]`); const er=el&&el.querySelector(".err");
    if(f.id==="ritmo"&&empty){ S.d.ritmo=ritmoRecomendado(S.d); return; }
    if(f.id==="estilos"&&empty){ S.d.estilos=estilosRecomendados(S.d); return; }
    let msg="";
    if(empty) msg = f.type==="check"?"Marca la casilla para continuar.":"Esta respuesta hace falta para preparar tu alta.";
    else if(f.type==="email"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) msg="Revisa el email: parece que le falta algo (ejemplo: nombre@negocio.es).";
    if(msg){ ok=false; if(er){er.textContent=msg;er.hidden=false;} else if(el){el.insertAdjacentHTML("beforeend",`<div class="err">${msg}</div>`);} if(!first) first=el; }
    else if(er) er.hidden=true;
  });
  if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
  return ok;
}
function go(n){ S.step=Math.max(0,Math.min(STEPS.length-1,n)); render(); window.scrollTo({top:0}); }

/* ===== Utilidades ===== */
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2200); }
function copy(text,label){
  const done=()=>toast(label+" copiado");
  try{ navigator.clipboard.writeText(text).then(done,()=>fallback()); }catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy");}catch(e){} ta.remove(); toast(ok?label+" copiado":"No se pudo copiar: selecciona el texto a mano"); }
}
/* ===== Colores desde el logo ===== */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s,l];}
function hsl2hex(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("").toUpperCase();}
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hueDist=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d;};
function paletaDesdeLogo(img){
  const s=96,c=document.createElement("canvas");c.width=s;c.height=s;const x=c.getContext("2d");
  x.drawImage(img,0,0,s,s);const px=x.getImageData(0,0,s,s).data,b={};
  for(let i=0;i<px.length;i+=4){
    if(px[i+3]<128) continue;
    const q=[px[i],px[i+1],px[i+2]].map(v=>Math.min(255,Math.round(v/24)*24));
    const k=q.join(",");(b[k]=b[k]||{rgb:q,n:0}).n++;
  }
  // agrupar y ordenar: ignoramos el blanco del fondo
  let cols=Object.values(b).map(o=>{const [h,sat,l]=rgb2hsl(...o.rgb);return {...o,h,s:sat,l,hex:"#"+o.rgb.map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase()};})
    .filter(o=>o.l<.93).sort((a,b)=>b.n-a.n);
  if(!cols.length) return null;
  const total=cols.reduce((t,o)=>t+o.n,0);
  cols=cols.filter(o=>o.n/total>.01);
  const vivos=cols.filter(o=>o.s>.18&&o.l>.12&&o.l<.85).sort((a,b)=>b.n*(.4+b.s)-a.n*(.4+a.s));
  const oscuro=cols.filter(o=>o.l<.25).sort((a,b)=>b.n-a.n)[0];
  const princ=vivos[0]||cols[0];
  const acc=vivos.find(o=>hueDist(o.h,princ.h)>35||Math.abs(o.l-princ.l)>.3)||null;
  const fondo=hsl2hex(princ.h,Math.min(princ.s,.45),.965);
  const texto=oscuro&&oscuro!==princ?oscuro.hex:hsl2hex(princ.h,Math.min(princ.s,.35),.14);
  const acento=acc?acc.hex:hsl2hex((princ.h+30)%360,Math.max(.55,princ.s),Math.min(.6,Math.max(.45,princ.l)));
  const extra=[...new Set(cols.filter(o=>o.l>.08).slice(0,6).map(o=>o.hex))];
  return {principal:princ.hex,fondo,acento,texto,extra};
}

/* ===== Eventos ===== */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-choice],[data-multi]"); if(!t) return;
  if(t.id==="next"){ if(S.step===0||validate()) go(S.step+1); return; }
  if(t.id==="prev"){ go(S.step-1); return; }
  if(t.id==="reset"){ S.d={}; S.step=0; render(); toast("Respuestas borradas"); return; }
  if(t.id==="modeBtn"){ S.interno=!S.interno; render(); if(S.interno) $("#internal").scrollIntoView({behavior:"smooth"}); return; }
  if(t.dataset.usecolor){ S.d.colores={...(S.d.colores||paleta(S.d)),principal:t.dataset.usecolor}; save(); updatePreview(); toast("Color principal cambiado"); return; }
  if(t.dataset.choice){ S.d[t.dataset.choice]=t.dataset.v;
    if(t.dataset.choice==="tieneColores"&&t.dataset.v==="logo"&&S.d.logoPaleta&&S.d.logoPaleta.principal){ const {extra,...c}=S.d.logoPaleta; S.d.colores=c; } const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  if(t.dataset.multi){ const k=t.dataset.multi, f=STEPS[S.step].fields.find(f=>f.id===k); let a=S.d[k]||[];
    a=a.includes(t.dataset.v)?a.filter(x=>x!==t.dataset.v):[...a,t.dataset.v]; if(f&&f.max&&a.length>f.max) a=a.slice(-f.max);
    S.d[k]=a; const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  if(t.dataset.copy){ const w=t.dataset.copy;
    if(w==="resumen") copy(resumenTexto(),"Resumen");
    if(w==="respuestas") copy(JSON.stringify(buildRespuestas(),null,2),"Ficha");
    if(w==="marca") copy(JSON.stringify(buildMarca(),null,2),"marca.json");
    if(w==="plan") copy(JSON.stringify(buildPlan(),null,2),"plan.json");
    if(w==="email") copy(CONFIG.emailContacto,"Email");
    return; }
  if(t.id==="dl"){ guardarArchivo(`respuestas_${slug(S.d.nombre)}.json`,new Blob([JSON.stringify(buildRespuestas(),null,2)],{type:"application/json"})); return; }
  if(t.id==="pdfBtn"){ t.disabled=true; construirPDF().then(b=>guardarArchivo(nombreArchivo("pdf"),b)).catch(()=>toast("No se pudo crear el PDF")).finally(()=>t.disabled=false); return; }
  if(t.id==="shareBtn"){ construirPDF().then(b=>{ const f=new File([b],nombreArchivo("pdf"),{type:"application/pdf"}); return navigator.share({files:[f],title:"Resumen de alta",text:"Resumen de alta de "+(S.d.nombre||"")}); }).catch(e=>{ if(e&&e.name!=="AbortError") toast("No se pudo compartir; descarga el PDF y adjúntalo"); }); return; }
  if(t.dataset.goto){ go(+t.dataset.goto); return; }
  if(t.id==="nuevo"){ $("#nuevoConfirm").hidden=false; $("#nuevoConfirm").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  if(t.id==="nuevoNo"){ $("#nuevoConfirm").hidden=true; return; }
  if(t.id==="nuevoOk"){ S.d={}; go(1); toast("Listo para un nuevo negocio"); return; }
  if(t.id==="impBtn"){ loadJSON($("#imp").value); return; }
  if(t.id==="demo"){ S.d=JSON.parse(JSON.stringify(DEMO)); S.step=STEPS.length-1; render(); toast("Ejemplo cargado"); return; }
});
function loadJSON(txt){
  const er=$("#impErr");
  try{ const o=JSON.parse(txt); delete o._meta; delete o.paleta; delete o._marca; delete o._plan; delete o._diagnostico; if(Array.isArray(o.logoPaleta)) o.logoPaleta={extra:o.logoPaleta}; S.d=o; S.step=STEPS.length-1; render(); toast("Ficha cargada"); }
  catch(e){ er.textContent="No es un JSON válido. Pega la ficha completa, desde la primera { hasta la última }."; er.hidden=false; }
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){ S.d[t.dataset.k]=t.value; save(); if(S.interno&&t.dataset.k==="nombre") renderInternal(); return; }

document.addEventListener("change",e=>{
  const t=e.target;

      const m=400, sc=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*sc)||m; c.height=Math.round(img.height*sc)||m; c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      S.d.logo=c.toDataURL("image/png"); let pal=null; try{ pal=paletaDesdeLogo(c); }catch(e){}

      img.src=r.result; };
    r.readAsDataURL(file);
  }
});
